name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        shell: bash
        run: |
          python3 -u <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from collections import Counter
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          README = Path("README.md")

          LEETCODE_URL = "https://leetcode.com/graphql/"

          QUERY = """
          query problemsetQuestionList(
            $categorySlug: String,
            $limit: Int,
            $skip: Int,
            $filters: QuestionListFilterInput
          ) {
            problemsetQuestionList: questionList(
              categorySlug: $categorySlug
              limit: $limit
              skip: $skip
              filters: $filters
            ) {
              total: totalNum
              questions: data {
                questionFrontendId
                title
                titleSlug
                difficulty
                topicTags {
                  name
                }
              }
            }
          }
          """

          HEADERS = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (GitHub Actions)",
              "Accept": "application/json",
              "Referer": "https://leetcode.com/problemset/"
          }


          # ============================================================
          # SLUG GENERATION
          # ============================================================

          def make_slug(folder_name):
              name = folder_name.strip()

              # Remove problem number
              # Examples:
              # 1 Two Sum -> Two Sum
              # 0383-ransom-note -> ransom-note
              # 1047 Remove All Adjacent Duplicates -> Remove All...
              name = re.sub(r"^\d+\s*[-]?\s*", "", name)

              name = name.lower()

              name = re.sub(r"[^a-z0-9]+", "-", name)
              name = re.sub(r"-+", "-", name)

              return name.strip("-")


          # ============================================================
          # FETCH LEETCODE PROBLEMS
          # ============================================================

          def fetch_page(skip, limit=50, retries=3):

              payload = {
                  "query": QUERY,
                  "variables": {
                      "categorySlug": "",
                      "skip": skip,
                      "limit": limit,
                      "filters": {}
                  },
                  "operationName": "problemsetQuestionList"
              }

              body = json.dumps(payload).encode("utf-8")

              for attempt in range(1, retries + 1):

                  try:

                      request = Request(
                          LEETCODE_URL,
                          data=body,
                          headers=HEADERS,
                          method="POST"
                      )

                      with urlopen(request, timeout=30) as response:

                          raw = response.read().decode("utf-8")

                          data = json.loads(raw)

                          if "errors" in data:
                              raise RuntimeError(
                                  f"LeetCode GraphQL error: {data['errors']}"
                              )

                          result = (
                              data
                              .get("data", {})
                              .get("problemsetQuestionList")
                          )

                          if not result:
                              raise RuntimeError(
                                  f"Invalid LeetCode response: {data}"
                              )

                          return result

                  except HTTPError as e:

                      print(
                          f"HTTP error {e.code} "
                          f"(attempt {attempt}/{retries})"
                      )

                      try:
                          print(
                              e.read()
                              .decode("utf-8")[:1000]
                          )
                      except Exception:
                          pass

                  except (URLError, TimeoutError) as e:

                      print(
                          f"Network error "
                          f"(attempt {attempt}/{retries}): {e}"
                      )

                  except Exception as e:

                      print(
                          f"Error "
                          f"(attempt {attempt}/{retries}): {e}"
                      )

                  if attempt < retries:
                      time.sleep(3 * attempt)

              return None


          def fetch_all_problems():

              print("Fetching LeetCode problem database...")

              all_questions = []

              skip = 0
              limit = 50
              total = None

              while True:

                  print(
                      f"Fetching problems "
                      f"{skip + 1}-{skip + limit}..."
                  )

                  result = fetch_page(
                      skip=skip,
                      limit=limit
                  )

                  if result is None:
                      raise RuntimeError(
                          "Could not fetch LeetCode problem data."
                      )

                  questions = result.get("questions", [])

                  if total is None:
                      total = result.get("total", 0)

                      print(
                          f"LeetCode reports "
                          f"{total} total problems."
                      )

                  if not questions:
                      break

                  all_questions.extend(questions)

                  skip += len(questions)

                  print(
                      f"Fetched {len(all_questions)}/{total}"
                  )

                  if skip >= total:
                      break

                  time.sleep(0.5)

              print(
                  f"Successfully fetched "
                  f"{len(all_questions)} problems."
              )

              return all_questions


          # ============================================================
          # FIND SOLUTION FOLDERS
          # ============================================================

          solution_dirs = []

          for path in Path(".").iterdir():

              if not path.is_dir():
                  continue

              if path.name in {
                  ".git",
                  ".github",
                  "Topics"
              }:
                  continue

              if re.match(r"^\d+", path.name):
                  solution_dirs.append(path.name)

          solution_dirs.sort(
              key=lambda x: (
                  int(re.match(r"^\d+", x).group()),
                  x.lower()
              )
          )

          print()
          print("=" * 60)
          print(
              f"Found {len(solution_dirs)} solution folders."
          )
          print("=" * 60)


          # ============================================================
          # FETCH PROBLEM DATA
          # ============================================================

          problem_data = fetch_all_problems()

          problems = {}

          for problem in problem_data:

              slug = problem.get("titleSlug")

              if slug:
                  problems[slug] = problem


          # ============================================================
          # CALCULATE STATISTICS
          # ============================================================

          difficulties = Counter()
          topics = Counter()

          failed = []
          matched = []

          print()
          print("=" * 60)
          print("Matching solution folders")
          print("=" * 60)

          for index, folder in enumerate(
              solution_dirs,
              start=1
          ):

              slug = make_slug(folder)

              problem = problems.get(slug)

              if not problem:

                  print(
                      f"[{index}/{len(solution_dirs)}] "
                      f"NOT FOUND: {folder} -> {slug}"
                  )

                  failed.append(folder)

                  continue

              print(
                  f"[{index}/{len(solution_dirs)}] "
                  f"{folder} -> {problem.get('title')}"
              )

              matched.append(folder)

              difficulty = problem.get("difficulty")

              if difficulty:
                  difficulties[difficulty] += 1

              for tag in problem.get("topicTags", []):

                  topic = tag.get("name")

                  if topic:
                      topics[topic] += 1


          total = sum(difficulties.values())


          # ============================================================
          # PRINT STATISTICS
          # ============================================================

          print()
          print("=" * 60)
          print("LeetCode Statistics")
          print("=" * 60)

          print(
              f"Easy:   {difficulties['Easy']}"
          )

          print(
              f"Medium: {difficulties['Medium']}"
          )

          print(
              f"Hard:   {difficulties['Hard']}"
          )

          print(
              f"Total:  {total}"
          )

          print(
              f"Matched folders: {len(matched)}"
          )

          print(
              f"Failed folders:  {len(failed)}"
          )


          # ============================================================
          # PROGRESS BAR
          # ============================================================

          def bar(value, maximum, length=25):

              if maximum <= 0:
                  return ""

              filled = round(
                  value / maximum * length
              )

              filled = max(
                  0,
                  min(length, filled)
              )

              return (
                  "█" * filled
                  + "░" * (length - filled)
              )


          maximum = max(
              difficulties["Easy"],
              difficulties["Medium"],
              difficulties["Hard"],
              1
          )


          # ============================================================
          # BUILD README GENERATED SECTION
          # ============================================================

          generated_section = f"""
          <!-- LEETCODE_STATS_START -->

          ## 📊 LeetCode Progress

          | 🟢 Easy | 🟡 Medium | 🔴 Hard | 🧩 Total |
          | :---: | :---: | :---: | :---: |
          | **{difficulties["Easy"]}** | **{difficulties["Medium"]}** | **{difficulties["Hard"]}** | **{total}** |

          ### Difficulty Distribution

          ```text
          🟢 Easy       {difficulties["Easy"]:>4}  {bar(difficulties["Easy"], maximum)}
          🟡 Medium     {difficulties["Medium"]:>4}  {bar(difficulties["Medium"], maximum)}
          🔴 Hard       {difficulties["Hard"]:>4}  {bar(difficulties["Hard"], maximum)}
          ```

          ## 🧠 Topics

          | Topic | Problems | Progress |
          | :--- | ---: | :--- |
          """

          max_topic = max(
              topics.values(),
              default=1
          )

          for topic, count in topics.most_common():

              topic_bar = bar(
                  count,
                  max_topic,
                  20
              )

              generated_section += (
                  f"| {topic} | **{count}** | "
                  f"`{topic_bar}` |\n"
              )


          generated_section += """
          
          <!-- LEETCODE_STATS_END -->
          """


          # ============================================================
          # UPDATE README
          # ============================================================

          existing = README.read_text(
              encoding="utf-8"
          )


          start_marker = "<!-- LEETCODE_STATS_START -->"
          end_marker = "<!-- LEETCODE_STATS_END -->"


          if (
              start_marker in existing
              and end_marker in existing
          ):

              # Replace existing generated section
              pattern = (
                  re.escape(start_marker)
                  + r".*?"
                  + re.escape(end_marker)
              )

              new_readme = re.sub(
                  pattern,
                  generated_section.strip(),
                  existing,
                  flags=re.DOTALL
              )

          else:

              # Remove old generated statistics.
              # This also removes old duplicate
              # Difficulty Distribution sections.

              headings = [
                  "## 📊 LeetCode Progress",
                  "## LeetCode Progress",
                  "## 📈 LeetCode Progress"
              ]

              cut_position = None

              for heading in headings:

                  position = existing.find(heading)

                  if position != -1:

                      if (
                          cut_position is None
                          or position < cut_position
                      ):
                          cut_position = position

              if cut_position is not None:

                  base_readme = existing[:cut_position].rstrip()

              else:

                  base_readme = existing.rstrip()

              new_readme = (
                  base_readme
                  + "\n\n"
                  + generated_section.strip()
                  + "\n"
              )


          README.write_text(
              new_readme,
              encoding="utf-8"
          )


          # ============================================================
          # FINISHED
          # ============================================================

          print()
          print("=" * 60)
          print("README updated successfully.")
          print("=" * 60)

          if failed:

              print()
              print(
                  f"Problems that could not be matched: "
                  f"{len(failed)}"
              )

              for item in failed:

                  print(
                      f" - {item}"
                  )

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "Update LeetCode README statistics"
          git push
