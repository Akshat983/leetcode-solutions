name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README statistics
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import re
          import time
          import json
          from pathlib import Path
          from collections import Counter
          from urllib.request import Request, urlopen

          README = Path("README.md")
          LEETCODE_URL = "https://leetcode.com/graphql"

          # ---------------------------------------------------------
          # Fetch complete LeetCode problem list
          # ---------------------------------------------------------

          QUERY = """
          query problemsetQuestionList(
              $categorySlug: String
              $limit: Int
              $skip: Int
              $filters: QuestionListFilterInput
          ) {
              questionList(
                  categorySlug: $categorySlug
                  limit: $limit
                  skip: $skip
                  filters: $filters
              ) {
                  totalNum
                  data {
                      questionFrontendId
                      title
                      titleSlug
                      difficulty
                      topicTags {
                          name
                      }
                  }
              }
          }
          """

          def graphql(query, variables):
              payload = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode("utf-8")

              request = Request(
                  LEETCODE_URL,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0",
                      "Referer": "https://leetcode.com/"
                  },
                  method="POST"
              )

              with urlopen(request, timeout=30) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # ---------------------------------------------------------
          # Download all available LeetCode problems
          # ---------------------------------------------------------

          print("Fetching LeetCode problem database...")

          all_problems = []
          skip = 0
          limit = 100

          while True:

              data = graphql(
                  QUERY,
                  {
                      "categorySlug": "",
                      "skip": skip,
                      "limit": limit,
                      "filters": {}
                  }
              )

              question_list = (
                  data.get("data", {})
                      .get("questionList")
              )

              if not question_list:
                  raise RuntimeError(
                      "Could not fetch LeetCode problem list."
                  )

              problems = question_list.get("data", [])

              if not problems:
                  break

              all_problems.extend(problems)

              total = question_list.get("totalNum", 0)

              print(
                  f"Fetched {len(all_problems)}/{total} problems"
              )

              skip += limit

              if skip >= total:
                  break

              time.sleep(0.2)

          print(
              f"LeetCode database contains "
              f"{len(all_problems)} problems."
          )

          # ---------------------------------------------------------
          # Build lookup by problem number
          # ---------------------------------------------------------

          problem_by_id = {}

          for problem in all_problems:

              frontend_id = problem.get(
                  "questionFrontendId"
              )

              if frontend_id:
                  problem_by_id[str(frontend_id)] = problem

          # ---------------------------------------------------------
          # Find solution folders
          # ---------------------------------------------------------

          solution_dirs = []

          for path in Path(".").iterdir():

              if not path.is_dir():
                  continue

              if path.name in {
                  ".git",
                  ".github",
                  "Topics"
              }:
                  continue

              match = re.match(
                  r"^(\d+)",
                  path.name
              )

              if match:
                  solution_dirs.append(
                      (
                          int(match.group(1)),
                          path.name
                      )
                  )

          solution_dirs.sort()

          print()
          print(
              f"Found {len(solution_dirs)} "
              f"solution folders."
          )

          difficulties = Counter()
          topics = Counter()

          failed = []

          # ---------------------------------------------------------
          # Process every solution
          # ---------------------------------------------------------

          for index, (problem_id, folder) in enumerate(
              solution_dirs,
              start=1
          ):

              problem = problem_by_id.get(
                  str(problem_id)
              )

              print(
                  f"[{index}/{len(solution_dirs)}] "
                  f"{folder}"
              )

              if not problem:

                  print(
                      "  WARNING: Problem ID not found"
                  )

                  failed.append(folder)
                  continue

              title = problem.get(
                  "title",
                  "Unknown"
              )

              slug = problem.get(
                  "titleSlug",
                  ""
              )

              difficulty = problem.get(
                  "difficulty"
              )

              print(
                  f"  -> {title}"
              )

              print(
                  f"  -> slug: {slug}"
              )

              if difficulty:
                  difficulties[difficulty] += 1

              for tag in problem.get(
                  "topicTags",
                  []
              ):

                  topic_name = tag.get(
                      "name"
                  )

                  if topic_name:
                      topics[topic_name] += 1

          # ---------------------------------------------------------
          # Statistics
          # ---------------------------------------------------------

          total = sum(
              difficulties.values()
          )

          easy = difficulties["Easy"]
          medium = difficulties["Medium"]
          hard = difficulties["Hard"]

          print()
          print("==============================")
          print("LeetCode Statistics")
          print("==============================")
          print(f"Easy:   {easy}")
          print(f"Medium: {medium}")
          print(f"Hard:   {hard}")
          print(f"Total:  {total}")

          if failed:

              print()
              print("Failed problems:")

              for item in failed:
                  print(
                      f" - {item}"
                  )

          # ---------------------------------------------------------
          # Progress bar
          # ---------------------------------------------------------

          def bar(
              value,
              maximum,
              length=30
          ):

              if maximum == 0:
                  return ""

              filled = round(
                  (value / maximum) * length
              )

              return (
                  "█" * filled
                  +
                  "░" * (
                      length - filled
                  )
              )

          maximum = max(
              easy,
              medium,
              hard,
              1
          )

          # ---------------------------------------------------------
          # Difficulty section
          # ---------------------------------------------------------

          difficulty_section = f"""## 📊 LeetCode Progress

          | 🟢 Easy | 🟡 Medium | 🔴 Hard | 🧩 Total |
          | :---: | :---: | :---: | :---: |
          | **{easy}** | **{medium}** | **{hard}** | **{total}** |

          ### Difficulty Distribution

          ```text
          🟢 Easy       {easy:>4}  {bar(easy, maximum)}
          🟡 Medium     {medium:>4}  {bar(medium, maximum)}
          🔴 Hard       {hard:>4}  {bar(hard, maximum)}
          ```
          """

          # ---------------------------------------------------------
          # Topic section
          # ---------------------------------------------------------

          topic_lines = [
              "## 🧠 Topics",
              "",
              "| Topic | Problems | Progress |",
              "| :--- | ---: | :--- |"
          ]

          max_topic = max(
              topics.values(),
              default=1
          )

          for topic, count in topics.most_common():

              topic_bar = bar(
                  count,
                  max_topic,
                  20
              )

              topic_lines.append(
                  f"| {topic} | **{count}** | "
                  f"`{topic_bar}` |"
              )

          topic_section = (
              "\n".join(topic_lines)
              + "\n"
          )

          # ---------------------------------------------------------
          # Update README
          # ---------------------------------------------------------

          text = README.read_text(
              encoding="utf-8"
          )

          # Remove old generated statistics
          text = re.sub(
              r"## 📊 LeetCode Progress.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )

          # Remove old generated topics
          text = re.sub(
              r"## 🧠 Topics.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )

          marker = (
              "A collection of my LeetCode solutions, "
              "focused on Data Structures, Algorithms, "
              "problem solving, and competitive programming."
          )

          generated = (
              "\n\n"
              + difficulty_section
              + "\n"
              + topic_section
          )

          if marker in text:

              text = text.replace(
                  marker,
                  marker + generated,
                  1
              )

          else:

              text = (
                  difficulty_section
                  + "\n"
                  + topic_section
                  + "\n"
                  + text
              )

          README.write_text(
              text,
              encoding="utf-8"
          )

          print()
          print(
              "README updated successfully."
          )

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "Update LeetCode statistics"
            git push
          fi
