name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        shell: bash
        run: |
          python3 -u <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from collections import Counter
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError


          README = Path("README.md")

          LEETCODE_URL = "https://leetcode.com/graphql"

          BATCH_SIZE = 50
          MAX_RETRIES = 5


          # ============================================================
          # LEETCODE QUERY
          # ============================================================

          QUERY = """
          query problemsetQuestionList(
            $categorySlug: String
            $limit: Int
            $skip: Int
          ) {
            problemsetQuestionList(
              categorySlug: $categorySlug
              limit: $limit
              skip: $skip
            ) {
              total
              questions {
                questionFrontendId
                title
                titleSlug
                difficulty
                topicTags {
                  name
                }
              }
            }
          }
          """


          # ============================================================
          # FETCH ONE PAGE
          # ============================================================

          def fetch_page(skip, limit):

              payload = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "categorySlug": "",
                      "limit": limit,
                      "skip": skip
                  }
              }).encode("utf-8")

              for attempt in range(1, MAX_RETRIES + 1):

                  try:

                      request = Request(
                          LEETCODE_URL,
                          data=payload,
                          headers={
                              "Content-Type": "application/json",
                              "Accept": "application/json",
                              "User-Agent": "Mozilla/5.0"
                          },
                          method="POST"
                      )

                      with urlopen(
                          request,
                          timeout=60
                      ) as response:

                          data = json.loads(
                              response.read().decode("utf-8")
                          )

                      if "errors" in data:
                          raise RuntimeError(
                              str(data["errors"])
                          )

                      return data

                  except HTTPError as error:

                      print(
                          f"HTTP Error {error.code} "
                          f"(attempt {attempt}/{MAX_RETRIES})"
                      )

                      if attempt == MAX_RETRIES:
                          raise

                      time.sleep(attempt * 3)

                  except (URLError, TimeoutError, RuntimeError) as error:

                      print(
                          f"Request failed "
                          f"(attempt {attempt}/{MAX_RETRIES}): {error}"
                      )

                      if attempt == MAX_RETRIES:
                          raise

                      time.sleep(attempt * 3)


          # ============================================================
          # FETCH ALL LEETCODE PROBLEMS
          # ============================================================

          def fetch_all_problems():

              print("=" * 60)
              print("Fetching LeetCode problem database...")
              print("=" * 60)

              first_page = fetch_page(
                  0,
                  BATCH_SIZE
              )

              problemset = (
                  first_page
                  .get("data", {})
                  .get("problemsetQuestionList", {})
              )

              total_problems = problemset.get(
                  "total",
                  0
              )

              all_problems = problemset.get(
                  "questions",
                  []
              )

              print(
                  f"LeetCode reports "
                  f"{total_problems} total problems."
              )

              print(
                  f"Fetched "
                  f"{len(all_problems)}/{total_problems}"
              )

              skip = BATCH_SIZE

              while skip < total_problems:

                  end = min(
                      skip + BATCH_SIZE,
                      total_problems
                  )

                  print(
                      f"Fetching problems "
                      f"{skip + 1}-{end}..."
                  )

                  page = fetch_page(
                      skip,
                      BATCH_SIZE
                  )

                  problemset = (
                      page
                      .get("data", {})
                      .get("problemsetQuestionList", {})
                  )

                  questions = problemset.get(
                      "questions",
                      []
                  )

                  if not questions:
                      break

                  all_problems.extend(
                      questions
                  )

                  print(
                      f"Fetched "
                      f"{len(all_problems)}/{total_problems}"
                  )

                  skip += BATCH_SIZE

                  time.sleep(0.2)

              print()
              print(
                  f"Successfully fetched "
                  f"{len(all_problems)} problems."
              )

              return all_problems


          # ============================================================
          # CONVERT FOLDER NAME TO LEETCODE SLUG
          # ============================================================

          def make_slug(folder_name):

              name = re.sub(
                  r"^\d+\s*[-]?\s*",
                  "",
                  folder_name
              )

              name = name.lower()

              name = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  name
              )

              name = re.sub(
                  r"-+",
                  "-",
                  name
              )

              return name.strip("-")


          # ============================================================
          # FIND SOLUTION FOLDERS
          # ============================================================

          solution_dirs = []

          for path in Path(".").iterdir():

              if not path.is_dir():
                  continue

              if path.name in {
                  ".git",
                  ".github",
                  "Topics"
              }:
                  continue

              if re.match(
                  r"^\d+",
                  path.name
              ):
                  solution_dirs.append(
                      path.name
                  )


          def folder_number(folder):

              match = re.match(
                  r"^(\d+)",
                  folder
              )

              if match:
                  return int(
                      match.group(1)
                  )

              return 999999


          solution_dirs.sort(
              key=folder_number
          )


          print()
          print("=" * 60)
          print(
              f"Found {len(solution_dirs)} solution folders."
          )
          print("=" * 60)


          # ============================================================
          # FETCH PROBLEMS
          # ============================================================

          problem_data = fetch_all_problems()


          # ============================================================
          # CREATE LOOKUP
          # ============================================================

          problems = {}

          for problem in problem_data:

              slug = problem.get(
                  "titleSlug"
              )

              if slug:
                  problems[slug] = problem


          # ============================================================
          # MATCH SOLUTIONS
          # ============================================================

          print()
          print("=" * 60)
          print("Matching solution folders")
          print("=" * 60)

          difficulties = Counter()
          topics = Counter()

          failed = []
          matched = []


          for index, folder in enumerate(
              solution_dirs,
              start=1
          ):

              slug = make_slug(
                  folder
              )

              problem = problems.get(
                  slug
              )

              if not problem:

                  print(
                      f"[{index}/{len(solution_dirs)}] "
                      f"{folder} -> NOT FOUND"
                  )

                  failed.append(
                      folder
                  )

                  continue


              matched.append(
                  folder
              )


              title = problem.get(
                  "title",
                  folder
              )

              difficulty = problem.get(
                  "difficulty"
              )


              print(
                  f"[{index}/{len(solution_dirs)}] "
                  f"{folder} -> {title} -> {difficulty}"
              )


              # --------------------------------------------------------
              # DIFFICULTY
              # --------------------------------------------------------

              if difficulty == "Easy":

                  difficulties["Easy"] += 1

              elif difficulty == "Medium":

                  difficulties["Medium"] += 1

              elif difficulty == "Hard":

                  difficulties["Hard"] += 1

              else:

                  print(
                      f"WARNING: Unknown difficulty "
                      f"for {folder}: {difficulty}"
                  )


              # --------------------------------------------------------
              # TOPICS
              # --------------------------------------------------------

              for tag in problem.get(
                  "topicTags",
                  []
              ):

                  topic = tag.get(
                      "name"
                  )

                  if topic:
                      topics[topic] += 1


          # ============================================================
          # FINAL STATISTICS
          # ============================================================

          total = len(matched)

          easy = difficulties["Easy"]
          medium = difficulties["Medium"]
          hard = difficulties["Hard"]

          difficulty_total = (
              easy
              + medium
              + hard
          )


          print()
          print("=" * 60)
          print("FINAL STATISTICS")
          print("=" * 60)

          print(
              f"Solution folders : {len(solution_dirs)}"
          )

          print(
              f"Matched          : {total}"
          )

          print(
              f"Easy             : {easy}"
          )

          print(
              f"Medium           : {medium}"
          )

          print(
              f"Hard             : {hard}"
          )

          print(
              f"Difficulty total : {difficulty_total}"
          )


          # ============================================================
          # PROGRESS BAR
          # ============================================================

          def bar(
              value,
              maximum,
              length=30
          ):

              if maximum == 0:
                  return ""

              filled = round(
                  (value / maximum) * length
              )

              if filled > length:
                  filled = length

              return (
                  "█" * filled
                  + "░" * (
                      length - filled
                  )
              )


          maximum = max(
              easy,
              medium,
              hard,
              1
          )


          # ============================================================
          # BUILD DIFFICULTY SECTION
          # ============================================================

          difficulty_section = (
              "## 📊 LeetCode Progress\n\n"
              "| 🟢 Easy | 🟡 Medium | 🔴 Hard | 🧩 Total |\n"
              "| :---: | :---: | :---: | :---: |\n"
              "| **"
              + str(easy)
              + "** | **"
              + str(medium)
              + "** | **"
              + str(hard)
              + "** | **"
              + str(total)
              + "** |\n\n"
              "### Difficulty Distribution\n\n"
              "```text\n"
              "🟢 Easy       "
              + str(easy).rjust(4)
              + "  "
              + bar(easy, maximum)
              + "\n"
              "🟡 Medium     "
              + str(medium).rjust(4)
              + "  "
              + bar(medium, maximum)
              + "\n"
              "🔴 Hard       "
              + str(hard).rjust(4)
              + "  "
              + bar(hard, maximum)
              + "\n"
              "```\n"
          )


          # ============================================================
          # BUILD TOPICS SECTION
          # ============================================================

          topic_lines = []

          topic_lines.append(
              "### 🧠 Topics"
          )

          topic_lines.append("")

          topic_lines.append(
              "| Topic | Problems | Progress |"
          )

          topic_lines.append(
              "| :--- | ---: | :--- |"
          )


          max_topic = max(
              topics.values(),
              default=1
          )


          for topic, count in sorted(
              topics.items(),
              key=lambda x: (
                  -x[1],
                  x[0]
              )
          ):

              progress = bar(
                  count,
                  max_topic,
                  25
              )

              topic_lines.append(
                  "| "
                  + topic
                  + " | **"
                  + str(count)
                  + "** | `"
                  + progress
                  + "` |"
              )


          topic_section = (
              "\n".join(topic_lines)
              + "\n"
          )


          # ============================================================
          # BUILD FAILED SECTION
          # ============================================================

          failed_section = ""

          if failed:

              failed_lines = []

              failed_lines.append(
                  "### ⚠️ Problems Not Matched"
              )

              failed_lines.append("")

              failed_lines.append(
                  f"{len(failed)} solution folders "
                  "could not be matched:"
              )

              failed_lines.append("")

              for item in failed:

                  failed_lines.append(
                      "- `" + item + "`"
                  )

              failed_lines.append("")

              failed_section = "\n".join(
                  failed_lines
              )


          # ============================================================
          # COMPLETE GENERATED SECTION
          # ============================================================

          generated_section = (
              difficulty_section
              + "\n"
              + topic_section
              + "\n"
              + failed_section
          )


          # ============================================================
          # UPDATE README
          # ============================================================

          if not README.exists():

              print(
                  "README.md not found."
              )

              raise SystemExit(1)


          readme = README.read_text(
              encoding="utf-8"
          )


          marker = "## 📊 LeetCode Progress"


          if marker in readme:

              before = readme.split(
                  marker,
                  1
              )[0]

              readme = (
                  before.rstrip()
                  + "\n\n"
                  + generated_section
              )

          else:

              readme = (
                  readme.rstrip()
                  + "\n\n"
                  + generated_section
              )


          README.write_text(
              readme,
              encoding="utf-8"
          )


          # ============================================================
          # VERIFY README
          # ============================================================

          print()
          print("=" * 60)
          print("README verification")
          print("=" * 60)

          verify = README.read_text(
              encoding="utf-8"
          )


          if (
              "{" in verify
              and 'difficulties["Easy"]' in verify
          ):

              print(
                  "ERROR: Python expressions "
                  "were written literally."
              )

              raise SystemExit(1)


          print(
              "README generated correctly."
          )


          print()
          print("=" * 60)
          print("README updated successfully.")
          print("=" * 60)

          print(
              f"Easy   : {easy}"
          )

          print(
              f"Medium : {medium}"
          )

          print(
              f"Hard   : {hard}"
          )

          print(
              f"Total  : {total}"
          )


          if failed:

              print()
              print(
                  f"Unmatched folders: {len(failed)}"
              )

              for folder in failed:

                  print(
                      " - " + folder
                  )

          PY


      # ================================================================
      # COMMIT README
      # ================================================================

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
            exit 0
          fi

          git commit -m "Update LeetCode README statistics"
          git push


      - name: Complete
        run: |
          echo "LeetCode README update completed successfully."
