name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from collections import Counter
          from urllib.request import Request, urlopen

          README = Path("README.md")
          URL = "https://leetcode.com/graphql"

          QUERY = """
          query problemsetQuestionList($categorySlug: String, $limit: Int, $skip: Int) {
            problemsetQuestionList(
              categorySlug: $categorySlug
              limit: $limit
              skip: $skip
            ) {
              questions {
                titleSlug
                difficulty
                topicTags {
                  name
                }
              }
            }
          }
          """

          def fetch_problems():
              body = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "categorySlug": "",
                      "limit": 5000,
                      "skip": 0
                  }
              }).encode("utf-8")

              request = Request(
                  URL,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0"
                  },
                  method="POST"
              )

              with urlopen(request, timeout=60) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def make_slug(name):
              name = re.sub(
                  r"^\d+\s*[-]?\s*",
                  "",
                  name
              )

              name = name.lower()
              name = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  name
              )
              name = re.sub(
                  r"-+",
                  "-",
                  name
              )

              return name.strip("-")

          def bar(value, maximum, length=20):
              if maximum <= 0:
                  return ""

              filled = round(
                  value / maximum * length
              )

              return (
                  "█" * filled
                  + "░" * (length - filled)
              )

          # Find solution folders
          solution_dirs = []

          for path in Path(".").iterdir():

              if not path.is_dir():
                  continue

              if path.name in {
                  ".git",
                  ".github",
                  "Topics"
              }:
                  continue

              if re.match(r"^\d+", path.name):
                  solution_dirs.append(path.name)

          print(
              f"Found {len(solution_dirs)} solution folders."
          )

          # Fetch LeetCode problems
          print("Fetching LeetCode problems...")

          data = fetch_problems()

          questions = (
              data
              .get("data", {})
              .get("problemsetQuestionList", {})
              .get("questions", [])
          )

          problems = {}

          for question in questions:
              slug = question.get("titleSlug")

              if slug:
                  problems[slug] = question

          print(
              f"Fetched {len(problems)} problems."
          )

          # Calculate statistics
          difficulties = Counter()
          topics = Counter()
          failed = []

          for folder in sorted(solution_dirs):

              slug = make_slug(folder)
              problem = problems.get(slug)

              print(
                  f"{folder} -> {slug}"
              )

              if not problem:
                  print(
                      f"WARNING: Problem not found: {folder}"
                  )
                  failed.append(folder)
                  continue

              difficulty = problem.get("difficulty")

              if difficulty:
                  difficulties[difficulty] += 1

              for tag in problem.get(
                  "topicTags",
                  []
              ):

                  topic = tag.get("name")

                  if topic:
                      topics[topic] += 1

          total = sum(
              difficulties.values()
          )

          print()
          print("LeetCode Statistics")
          print("===================")
          print(
              f"Easy:   {difficulties['Easy']}"
          )
          print(
              f"Medium: {difficulties['Medium']}"
          )
          print(
              f"Hard:   {difficulties['Hard']}"
          )
          print(
              f"Total:  {total}"
          )

          # Difficulty
          maximum = max(
              difficulties["Easy"],
              difficulties["Medium"],
              difficulties["Hard"],
              1
          )

          difficulty_section = f"""## 📊 LeetCode Progress

          | 🟢 Easy | 🟡 Medium | 🔴 Hard | 🧩 Total |
          |:---:|:---:|:---:|:---:|
          | **{difficulties["Easy"]}** | **{difficulties["Medium"]}** | **{difficulties["Hard"]}** | **{total}** |

          ### Difficulty Distribution

          ```text
          🟢 Easy       {difficulties["Easy"]:>4}  {bar(difficulties["Easy"], maximum)}
          🟡 Medium     {difficulties["Medium"]:>4}  {bar(difficulties["Medium"], maximum)}
          🔴 Hard       {difficulties["Hard"]:>4}  {bar(difficulties["Hard"], maximum)}
          ```
          """

          # Topics
          topic_lines = [
              "## 🧠 Topics",
              "",
              "| Topic | Problems | Progress |",
              "|:---|---:|:---|"
          ]

          max_topic = max(
              topics.values(),
              default=1
          )

          for topic, count in topics.most_common():

              topic_bar = bar(
                  count,
                  max_topic,
                  20
              )

              topic_lines.append(
                  f"| {topic} | **{count}** | `{topic_bar}` |"
              )

          topic_section = (
              "\n".join(topic_lines)
              + "\n"
          )

          # Read README
          text = README.read_text(
              encoding="utf-8"
          )

          # Remove generated block from previous version
          text = re.sub(
              r"<!-- LEETCODE_STATS_START -->.*?<!-- LEETCODE_STATS_END -->",
              "",
              text,
              flags=re.S
          )

          # Remove old statistics
          text = re.sub(
              r"## 📊 LeetCode Progress.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )

          # Remove old topics
          text = re.sub(
              r"## 🧠 Topics.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )

          # Remove old difficulty sections
          text = re.sub(
              r"## Difficulty Distribution.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )

          # Clean blank lines
          text = re.sub(
              r"\n{3,}",
              "\n\n",
              text
          ).strip()

          # Generated content
          generated = (
              "<!-- LEETCODE_STATS_START -->\n\n"
              + difficulty_section
              + "\n"
              + topic_section
              + "\n"
              + "<!-- LEETCODE_STATS_END -->"
          )

          marker = (
              "A collection of my LeetCode solutions, "
              "focused on Data Structures, Algorithms, "
              "problem solving, and competitive programming."
          )

          if marker in text:

              text = text.replace(
                  marker,
                  marker
                  + "\n\n"
                  + generated,
                  1
              )

          else:

              text = (
                  generated
                  + "\n\n"
                  + text
              )

          README.write_text(
              text + "\n",
              encoding="utf-8"
          )

          print()
          print("README updated successfully.")

          if failed:
              print(
                  f"Problems not found: {len(failed)}"
              )

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "Update LeetCode statistics"
            git push
          fi
