name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from collections import Counter
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          README = Path("README.md")

          LEETCODE_URL = "https://leetcode.com/graphql"

          QUERY = """
          query questionData($titleSlug: String!) {
            question(titleSlug: $titleSlug) {
              questionId
              title
              difficulty
              topicTags {
                name
              }
            }
          }
          """

          def get_problem(slug):

              payload = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "titleSlug": slug
                  }
              }).encode("utf-8")

              request = Request(
                  LEETCODE_URL,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  },
                  method="POST"
              )

              try:

                  with urlopen(
                      request,
                      timeout=20
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except HTTPError as error:

                  print(
                      f"HTTP {error.code} for {slug}"
                  )

                  return None

              except Exception as error:

                  print(
                      f"Request failed for {slug}: {error}"
                  )

                  return None


          def make_slug(folder_name):

              name = re.sub(
                  r"^\d+\s*[-]?\s*",
                  "",
                  folder_name
              )

              name = name.lower()

              name = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  name
              )

              name = re.sub(
                  r"-+",
                  "-",
                  name
              )

              return name.strip("-")


          # --------------------------------------------------
          # Find solution folders
          # --------------------------------------------------

          solution_dirs = []

          for path in Path(".").iterdir():

              if not path.is_dir():
                  continue

              if path.name in {
                  ".git",
                  ".github",
                  "Topics"
              }:
                  continue

              if re.match(
                  r"^\d+",
                  path.name
              ):
                  solution_dirs.append(
                      path.name
                  )

          solution_dirs.sort()

          print(
              f"Found {len(solution_dirs)} solution folders."
          )


          # --------------------------------------------------
          # Statistics
          # --------------------------------------------------

          difficulties = Counter()
          topics = Counter()

          failed = []


          # --------------------------------------------------
          # Fetch metadata
          # --------------------------------------------------

          for index, folder in enumerate(
              solution_dirs,
              start=1
          ):

              slug = make_slug(folder)

              print(
                  f"[{index}/{len(solution_dirs)}] "
                  f"{folder} -> {slug}"
              )

              data = get_problem(slug)

              if not data:

                  failed.append(folder)

                  time.sleep(0.5)

                  continue


              question = (
                  data
                  .get("data", {})
                  .get("question")
              )


              if not question:

                  print(
                      "  WARNING: Problem not found"
                  )

                  failed.append(folder)

                  time.sleep(0.5)

                  continue


              difficulty = question.get(
                  "difficulty"
              )


              if difficulty:

                  difficulties[
                      difficulty
                  ] += 1


              for tag in question.get(
                  "topicTags",
                  []
              ):

                  topic = tag.get(
                      "name"
                  )

                  if topic:

                      topics[
                          topic
                      ] += 1


              # Be polite to LeetCode.
              time.sleep(0.3)


          # --------------------------------------------------
          # Statistics output
          # --------------------------------------------------

          total = sum(
              difficulties.values()
          )

          print()
          print("==============================")
          print("LeetCode Statistics")
          print("==============================")

          print(
              f"Easy:   {difficulties['Easy']}"
          )

          print(
              f"Medium: {difficulties['Medium']}"
          )

          print(
              f"Hard:   {difficulties['Hard']}"
          )

          print(
              f"Total:  {total}"
          )


          # --------------------------------------------------
          # Progress bar
          # --------------------------------------------------

          def bar(
              value,
              maximum,
              length=20
          ):

              if maximum <= 0:
                  return ""

              filled = round(
                  value / maximum * length
              )

              return (
                  "█" * filled
                  + "░" * (
                      length - filled
                  )
              )


          maximum = max(
              difficulties["Easy"],
              difficulties["Medium"],
              difficulties["Hard"],
              1
          )


          # --------------------------------------------------
          # Difficulty section
          # --------------------------------------------------

          difficulty_section = f"""
          ## 📊 LeetCode Progress

          | 🟢 Easy | 🟡 Medium | 🔴 Hard | 🧩 Total |
          |:---:|:---:|:---:|:---:|
          | **{difficulties["Easy"]}** | **{difficulties["Medium"]}** | **{difficulties["Hard"]}** | **{total}** |

          ### Difficulty Distribution

          ```text
          🟢 Easy       {difficulties["Easy"]:>4}  {bar(difficulties["Easy"], maximum)}
          🟡 Medium     {difficulties["Medium"]:>4}  {bar(difficulties["Medium"], maximum)}
          🔴 Hard       {difficulties["Hard"]:>4}  {bar(difficulties["Hard"], maximum)}
          ```
          """


          # --------------------------------------------------
          # Topics section
          # --------------------------------------------------

          topic_lines = [
              "## 🧠 Topics",
              "",
              "| Topic | Problems | Progress |",
              "|:---|---:|:---|"
          ]


          max_topic = max(
              topics.values(),
              default=1
          )


          for topic, count in topics.most_common():

              topic_bar = bar(
                  count,
                  max_topic,
                  20
              )

              topic_lines.append(
                  f"| {topic} | **{count}** | "
                  f"`{topic_bar}` |"
              )


          topic_section = (
              "\n".join(topic_lines)
          )


          # --------------------------------------------------
          # Read README
          # --------------------------------------------------

          text = README.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------
          # Remove previous generated sections
          # --------------------------------------------------

          text = re.sub(
              r"<!-- LEETCODE_STATS_START -->.*?"
              r"<!-- LEETCODE_STATS_END -->",
              "",
              text,
              flags=re.S
          )


          text = re.sub(
              r"## 📊 LeetCode Progress.*?"
              r"(?=^## |\Z)",
              "",
              text,
              flags=re.S | re.M
          )


          text = re.sub(
              r"## Difficulty Distribution.*?"
              r"(?=^## |\Z)",
              "",
              text,
              flags=re.S | re.M
          )


          text = re.sub(
              r"## 🧠 Topics.*?"
              r"(?=^## |\Z)",
              "",
              text,
              flags=re.S | re.M
          )


          # Remove excessive blank lines.
          text = re.sub(
              r"\n{3,}",
              "\n\n",
              text
          )


          text = text.rstrip()


          # --------------------------------------------------
          # Create ONE generated section
          # --------------------------------------------------

          generated_section = (
              "\n\n"
              "<!-- LEETCODE_STATS_START -->\n\n"
              + difficulty_section.strip()
              + "\n\n"
              + topic_section
              + "\n\n"
              "<!-- LEETCODE_STATS_END -->"
          )


          text += generated_section


          # --------------------------------------------------
          # Write README
          # --------------------------------------------------

          README.write_text(
              text + "\n",
              encoding="utf-8"
          )


          print()
          print("==============================")
          print("README updated successfully.")
          print("==============================")


          if failed:

              print()
              print(
                  f"Problems that could not be matched: "
                  f"{len(failed)}"
              )

              for item in failed:

                  print(
                      f" - {item}"
                  )

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "Update LeetCode statistics"
            git push
          fi
