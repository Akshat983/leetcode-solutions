name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from collections import Counter
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          README = Path("README.md")
          LEETCODE_URL = "https://leetcode.com/graphql"

          QUERY = """
          query questionData($titleSlug: String!) {
            question(titleSlug: $titleSlug) {
              questionId
              questionFrontendId
              title
              titleSlug
              difficulty
              topicTags {
                name
              }
            }
          }
          """

          def get_problem(slug):
              payload = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "titleSlug": slug
                  },
                  "operationName": "questionData"
              }).encode("utf-8")

              for attempt in range(3):

                  try:
                      request = Request(
                          LEETCODE_URL,
                          data=payload,
                          headers={
                              "Content-Type": "application/json",
                              "Accept": "application/json",
                              "User-Agent": "Mozilla/5.0"
                          },
                          method="POST"
                      )

                      with urlopen(
                          request,
                          timeout=30
                      ) as response:

                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                      if "errors" in result:
                          return None

                      return (
                          result
                          .get("data", {})
                          .get("question")
                      )

                  except (
                      HTTPError,
                      URLError,
                      TimeoutError
                  ) as error:

                      print(
                          f"  Attempt {attempt + 1} failed: {error}"
                      )

                      if attempt < 2:
                          time.sleep(2)

              return None


          def make_slug(folder_name):

              # Remove problem number.
              #
              # Examples:
              # 0387-first-unique-character-in-a-string
              # -> first-unique-character-in-a-string
              #
              # 1 Two Sum
              # -> two-sum

              name = re.sub(
                  r"^\d+\s*[-]?\s*",
                  "",
                  folder_name
              )

              name = name.lower()

              name = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  name
              )

              name = re.sub(
                  r"-+",
                  "-",
                  name
              )

              return name.strip("-")


          def make_search_name(folder_name):

              name = re.sub(
                  r"^\d+\s*[-]?\s*",
                  "",
                  folder_name
              )

              name = re.sub(
                  r"[-_]+",
                  " ",
                  name
              )

              return name.strip()


          # ==========================================================
          # FIND SOLUTION FOLDERS
          # ==========================================================

          solution_dirs = []

          for path in Path(".").iterdir():

              if not path.is_dir():
                  continue

              if path.name in {
                  ".git",
                  ".github",
                  "Topics"
              }:
                  continue

              if re.match(
                  r"^\d+",
                  path.name
              ):
                  solution_dirs.append(path.name)

          solution_dirs.sort()

          print()
          print("======================================")
          print("LeetCode README Updater")
          print("======================================")
          print(
              f"Found {len(solution_dirs)} solution folders."
          )
          print()


          # ==========================================================
          # STATISTICS
          # ==========================================================

          difficulties = Counter()
          topics = Counter()

          failed = []


          # ==========================================================
          # FETCH EACH PROBLEM
          # ==========================================================

          for index, folder in enumerate(
              solution_dirs,
              start=1
          ):

              slug = make_slug(folder)

              print(
                  f"[{index}/{len(solution_dirs)}] "
                  f"{folder} -> {slug}"
              )

              problem = get_problem(slug)

              if not problem:

                  print(
                      "  WARNING: Problem not found"
                  )

                  failed.append(folder)

                  continue

              difficulty = problem.get(
                  "difficulty"
              )

              if difficulty:

                  difficulties[difficulty] += 1

              for tag in problem.get(
                  "topicTags",
                  []
              ):

                  topic = tag.get("name")

                  if topic:
                      topics[topic] += 1

              # Small delay to avoid hammering LeetCode.
              time.sleep(0.15)


          # ==========================================================
          # PRINT STATISTICS
          # ==========================================================

          total = sum(
              difficulties.values()
          )

          print()
          print("======================================")
          print("LeetCode Statistics")
          print("======================================")
          print(
              f"Easy:   {difficulties['Easy']}"
          )
          print(
              f"Medium: {difficulties['Medium']}"
          )
          print(
              f"Hard:   {difficulties['Hard']}"
          )
          print(
              f"Total:  {total}"
          )

          print()

          if failed:

              print(
                  f"Failed: {len(failed)}"
              )

              for item in failed:
                  print(
                      f" - {item}"
                  )

          else:

              print(
                  "All problems fetched successfully."
              )


          # ==========================================================
          # BAR FUNCTION
          # ==========================================================

          def bar(
              value,
              maximum,
              length=20
          ):

              if maximum <= 0:
                  return ""

              filled = round(
                  value / maximum * length
              )

              return (
                  "█" * filled
                  + "░" * (length - filled)
              )


          # ==========================================================
          # DIFFICULTY SECTION
          # ==========================================================

          maximum = max(
              difficulties["Easy"],
              difficulties["Medium"],
              difficulties["Hard"],
              1
          )


          difficulty_section = "\n".join([
              "## 📊 LeetCode Progress",
              "",
              "| 🟢 Easy | 🟡 Medium | 🔴 Hard | 🧩 Total |",
              "|:---:|:---:|:---:|:---:|",
              (
                  f"| **{difficulties['Easy']}** "
                  f"| **{difficulties['Medium']}** "
                  f"| **{difficulties['Hard']}** "
                  f"| **{total}** |"
              ),
              "",
              "### Difficulty Distribution",
              "",
              "```text",
              (
                  f"🟢 Easy       "
                  f"{difficulties['Easy']:>4}  "
                  f"{bar(difficulties['Easy'], maximum)}"
              ),
              (
                  f"🟡 Medium     "
                  f"{difficulties['Medium']:>4}  "
                  f"{bar(difficulties['Medium'], maximum)}"
              ),
              (
                  f"🔴 Hard       "
                  f"{difficulties['Hard']:>4}  "
                  f"{bar(difficulties['Hard'], maximum)}"
              ),
              "```"
          ])


          # ==========================================================
          # TOPICS SECTION
          # ==========================================================

          topic_lines = [
              "## 🧠 Topics",
              "",
              "| Topic | Problems | Progress |",
              "|:---|---:|:---|"
          ]


          max_topic = max(
              topics.values(),
              default=1
          )


          for topic, count in topics.most_common():

              topic_bar = bar(
                  count,
                  max_topic,
                  20
              )

              topic_lines.append(
                  f"| {topic} | **{count}** | `{topic_bar}` |"
              )


          topic_section = "\n".join(
              topic_lines
          )


          # ==========================================================
          # READ README
          # ==========================================================

          text = README.read_text(
              encoding="utf-8"
          )


          # ==========================================================
          # REMOVE PREVIOUS GENERATED CONTENT
          # ==========================================================

          # Remove our marker-based generated section.
          text = re.sub(
              r"<!-- LEETCODE_STATS_START -->.*?<!-- LEETCODE_STATS_END -->",
              "",
              text,
              flags=re.S
          )


          # Remove previous generated statistics.
          text = re.sub(
              r"## 📊 LeetCode Progress.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )


          # Remove previous generated topics.
          text = re.sub(
              r"## 🧠 Topics.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )


          # Remove old standalone difficulty sections.
          text = re.sub(
              r"## Difficulty Distribution.*?(?=## |\Z)",
              "",
              text,
              flags=re.S
          )


          # Remove excessive blank lines.
          text = re.sub(
              r"\n{3,}",
              "\n\n",
              text
          ).strip()


          # ==========================================================
          # GENERATED SECTION
          # ==========================================================

          generated = "\n".join([
              "<!-- LEETCODE_STATS_START -->",
              "",
              difficulty_section,
              "",
              topic_section,
              "",
              "<!-- LEETCODE_STATS_END -->"
          ])


          # ==========================================================
          # INSERT GENERATED CONTENT
          # ==========================================================

          marker = (
              "A collection of my LeetCode solutions, "
              "focused on Data Structures, Algorithms, "
              "problem solving, and competitive programming."
          )


          if marker in text:

              text = text.replace(
                  marker,
                  marker
                  + "\n\n"
                  + generated,
                  1
              )

          else:

              text = (
                  generated
                  + "\n\n"
                  + text
              )


          # ==========================================================
          # WRITE README
          # ==========================================================

          README.write_text(
              text + "\n",
              encoding="utf-8"
          )


          print()
          print("======================================")
          print("README updated successfully.")
          print("======================================")


          if failed:

              print()
              print(
                  "Problems that could not be matched:"
              )

              for item in failed:
                  print(
                      f" - {item}"
                  )

          PY


      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "Update LeetCode statistics"
            git push
          fi
